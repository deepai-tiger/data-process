[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-data-process"
version = "0.1.0"
description = "Build clean Korean LLM training datasets from PDF/DOC/DOCX sources"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "docling>=2.129,<3",
  "docling-core>=2.98,<3",
  "pymupdf>=1.28",
  "pillow>=11",
  "lxml>=5",
  "regex>=2024.0",
  "datasketch>=1.6",
  "xxhash>=3.4",
  "rapidfuzz>=3.9",
  "pandas>=2.2",
  "pyarrow>=16",
  "typer>=0.12",
  "pyyaml>=6",
  "pydantic>=2.7",
  "tqdm>=4.66",
  "rich>=13",
]

[project.optional-dependencies]
# Korean word-spacing repair for OCR text (strongly recommended)
spacing = ["kiwipiepy>=0.20"]
# lightweight equation -> LaTeX recognizer, CPU friendly
formula = ["pix2tex>=0.1.2"]
# alternative OCR engine
easyocr = ["easyocr>=1.7"]
# Korean PP-OCRv5 trial (CPU)
paddleocr = ["paddleocr>=3.7", "paddlepaddle>=3.3.1"]
# tokenizer-accurate chunk lengths
tokenizer = ["transformers>=4.40"]
dev = ["pytest>=8"]

[project.scripts]
kdp = "kdp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
